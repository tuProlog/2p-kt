name: CI/CD
on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
  workflow_dispatch:

jobs:
  dispatcher:
    runs-on: ubuntu-26.04
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
      || startsWith(github.head_ref, 'refs/heads/dependabot/')
    outputs:
      summary-check-run: ${{ steps.summary-check-run.outputs.id }}
      code: ${{ steps.changes.outputs.code }}
    steps:
      # No paths-ignore on `push`: master requires "ci-cd / success" (strict), which a skipped workflow never reports,
      # leaving PRs whose last push only touched notes unmergeable. Pushes touching nothing but notes (Markdown outside
      # `documentation/`, which the site builds from, and a few repo files) skip the jobs instead, and success passes.
      - name: Detect pushes touching nothing that is built or tested
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          code=true
          if [[ "$GITHUB_EVENT_NAME" == push && -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            # the compare API lists at most 300 files: a longer list counts as code
            if files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" \
                --jq 'if (.files | length) < 300 then .files[].filename else "too-many" end'); then
              echo "$files"
              if [[ -n "$files" ]] && ! grep -qvE '^(\.gitignore|LICENSE|renovate\.json|.*\.md)$' <<< "$files" \
                  && ! grep -q '^documentation/' <<< "$files"; then
                code=false
              fi
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
      - name: Create the "CI summary" check run, which every job updates as it finishes
        id: summary-check-run
        # fork PRs only get a read-only token: they go without the live summary, and only get the final one
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name="CI summary" -f head_sha="${{ github.event.pull_request.head.sha || github.sha }}" \
            -f status=in_progress -f "details_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f "output[title]=⏳ CI started" -f "output[summary]=This summary fills in as jobs finish." --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
  ci-cd:
    needs:
      - dispatcher
    uses: ./.github/workflows/build-and-deploy.yml
    with:
      code: ${{ needs.dispatcher.outputs.code != 'false' }}
      summary-check-run: ${{ needs.dispatcher.outputs.summary-check-run }}
    secrets: inherit
  docs:
    needs:
      - dispatcher
      - ci-cd
    if: needs.dispatcher.outputs.code != 'false'
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
      checks: write
    uses: ./.github/workflows/docs.yml
    with:
      version: ${{ needs.ci-cd.outputs.version }}
      summary-check-run: ${{ needs.dispatcher.outputs.summary-check-run }}
    secrets: inherit
  summary:
    # whatever happened before: the summary of a failed or cancelled run matters most
    needs:
      - dispatcher
      - ci-cd
      - docs
    if: always() && needs.dispatcher.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      checks: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github
      - name: Write the CI summary
        uses: ./.github/actions/ci-summary
        with:
          final: 'true'
          check-run: ${{ needs.dispatcher.outputs.summary-check-run }}
          conclusion: >-
            ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
