name: Docs
on:
  workflow_call:
    inputs:
      version:
        description: "Version to force this build to use (from the release job), if any."
        required: false
        type: string
      summary-check-run:
        description: "Id of the run's \"CI summary\" check run, which each job updates as it finishes (see dispatcher.yml)."
        required: false
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
  checks: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      # empty on a workflow_dispatch run, or when the release job didn't actually release anything this run
      # (e.g. a non-release branch) -- ${LAST_VERSION:+...} below then omits -PforceVersion entirely, falling
      # back to the normal git-computed version, same as before this was wired up.
      LAST_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: DanySK/action-checkout@0.2.31
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install MkDocs Material
        run: pip install mkdocs-material
      - name: Build documentation site
        uses: DanySK/build-check-deploy-gradle-action@4.0.49
        with:
          retries-on-failure: '2'
          # the log feeds the CI summary's documentation warnings
          build-command: |
            set -o pipefail
            ./gradlew ${LAST_VERSION:+-PforceVersion=$LAST_VERSION} :documentation:assembleSite --console=plain 2>&1 | tee docs-build.log
          check-command: true
          should-deploy: false
          should-run-codecov: false
      - name: CI summary
        if: always()
        uses: ./.github/actions/ci-summary
        with:
          kind: docs
          name: ci-digest-docs
          log: docs-build.log
          outcome: ${{ job.status }}
          check-run: ${{ inputs.summary-check-run }}
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: documentation/build/assembledSite
  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
