name: CI/CD Process
on:
  workflow_call:
    outputs:
      version:
        description: "The version semantic-release released this run, if any (empty if no release happened)."
        value: ${{ jobs.release.outputs.version }}
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        # Not DanySK/action-checkout here: on pull_request events it checks out the read-only merge-ref
        # in detached HEAD, which git-auto-commit-action below can't push back to. Check out the actual
        # PR head branch instead (falls back to the normal ref for push/workflow_dispatch).
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}
          # A PAT, not the default GITHUB_TOKEN: pushes made with GITHUB_TOKEN don't trigger a `push`
          # event (GitHub's anti-recursion rule), only `pull_request: synchronize` -- and dispatcher.yml
          # skips CI on that event for same-repo PRs, assuming the paired `push` run already covered it.
          # Without a real push event, that assumption is false and the auto-fix commit ships un-tested.
          token: ${{ secrets.DEPLOYMENT_TOKEN || github.token }}
      - name: Auto-format (ktlint)
        id: autoformat
        uses: DanySK/build-check-deploy-gradle-action@4.0.46
        with:
          retries-on-failure: '2'
          build-command: ./gradlew ktlintFormat
          check-command: 'true'
          should-deploy: false
          should-run-codecov: false
      - name: Check style (ktlint, detekt)
        # Runs even if formatting above failed, so real findings are still visible for a human to fix.
        if: always()
        uses: DanySK/build-check-deploy-gradle-action@4.0.46
        with:
          retries-on-failure: '2'
          build-command: 'true'
          check-command: ./gradlew ktlintCheck detekt --parallel --continue
          should-deploy: false
          should-run-codecov: false
      - name: Commit formatting fixes, if any
        # Gated on the format step itself succeeding, not the check step: a real detekt/ktlint finding
        # is expected to fail the check and should still get the fix committed alongside it. But if
        # ktlintFormat itself errors, committing whatever partial changes it left would push a new commit
        # that retriggers CI, which fails the same way again -- an infinite loop of auto-commits.
        # Skipped for fork PRs: GITHUB_TOKEN can't push to a fork's branch.
        if: >-
          always() &&
          steps.autoformat.outcome == 'success' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(style): automatically apply ktlintFormat repo-wise"
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: DanySK/action-checkout@0.2.31
      - name: Ensure a headless-capable Chrome is available (for :ide-web:browserE2ETest)
        run: |
          # ubuntu-24.04 GitHub-hosted runners ship Google Chrome preinstalled (see actions/runner-images);
          # jsBrowserTest's karma-chrome-launcher already relies on that with no setup step of its own. This
          # only falls back to installing it if that default ever stops holding.
          if command -v google-chrome-stable >/dev/null || command -v google-chrome >/dev/null \
              || command -v chromium-browser >/dev/null || command -v chromium >/dev/null; then
            echo "Chrome already present (default runner image)."
          else
            echo "No default Chrome found; installing google-chrome-stable."
            sudo apt-get update && sudo apt-get install -y google-chrome-stable
          fi
      - uses: DanySK/build-check-deploy-gradle-action@4.0.46
        with:
          retries-on-failure: '2'
          # Dry-deployment
          deploy-command: >-
            ./gradlew
            publishAllPublicationsToProjectLocalRepository
            zipMavenCentralPortalPublication 
            releaseMavenCentralPortalPublication
            --dry-run
          check-command: ./gradlew check --parallel --continue
          should-deploy: true
          should-run-codecov: false
          maven-central-username: ${{ secrets.MAVEN_USERNAME }}
          maven-central-password: ${{ secrets.MAVEN_PASSWORD }}
          signing-key: ${{ secrets.SIGNING_KEY }}
          signing-password: ${{ secrets.SIGNING_PASSWORD }}
      - name: Run the ide-web browser end-to-end suite
        # Deliberately its own `./gradlew` invocation, not part of `check` above: running jsBrowserTest and
        # browserE2ETest's production webpack build within the SAME Gradle build corrupts state shared between
        # the two separate webpack executions (verified locally: the production bundle silently drops code that
        # is present, and passes every time, when this runs as its own build). See ide-web/build.gradle.kts.
        run: ./gradlew :ide-web:browserE2ETest
      - name: Install Xvfb (for the Swing IDE end-to-end suites)
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run the ide-swing and ide-plp-swing end-to-end suites
        # Genuinely drives Swing/AWT (java.awt.Robot included) against the real application window, so it
        # needs a real or virtual display -- never add -Djava.awt.headless=true here. Xvfb provides that
        # virtual X11 display; see buildSrc/src/main/kotlin/SwingE2eTesting.kt for the task itself.
        run: xvfb-run -a ./gradlew :ide-swing:swingE2eTest :ide-plp-swing:swingE2eTest
  test-extensively:
    needs:
      - lint
      - build
    # if: github.ref_name != 'master' || github.event.commits[0].author.name != 'renovate[bot]'
    uses: ./.github/workflows/test-extensively.yml
  release:
    permissions:
      contents: write
      packages: write
      id-token: write  # Required for OIDC on npmjs
    needs:
      - lint
      - build
      - test-extensively
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.released-version.outputs.version }}
    steps:
      - name: Checkout
        uses: DanySK/action-checkout@0.2.31
        with:
          token: ${{ secrets.DEPLOYMENT_TOKEN || github.token }}
      - name: Install Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: package.json
      - uses: DanySK/build-check-deploy-gradle-action@4.0.46
        with:
          retries-on-failure: '1'
          build-command: ./gradlew clean
          check-command: true
          deploy-command: |
            npm install
            npx semantic-release
          enable-cache: false
          should-run-codecov: false
          should-deploy: true
          npm-token: ${{ secrets.NPM_TOKEN }}
          github-token: ${{ github.token }}
          maven-central-username: ${{ secrets.MAVEN_USERNAME }}
          maven-central-password: ${{ secrets.MAVEN_PASSWORD }}
          signing-key: ${{ secrets.SIGNING_KEY }}
          signing-password: ${{ secrets.SIGNING_PASSWORD }}
      - name: Record the released version for downstream jobs
        # semantic-release's own deploy step (above) has no output build-check-deploy-gradle-action exposes,
        # so release.config.js drops the version into a $RUNNER_TEMP file instead (see its recordVersionCmd);
        # this step is what turns that file into an actual job output (see docs.yml, which consumes it).
        id: released-version
        run: |
          if [ -f "$RUNNER_TEMP/last-release-version.txt" ]; then
            echo "version=$(cat "$RUNNER_TEMP/last-release-version.txt")" >> "$GITHUB_OUTPUT"
          else
            echo "No release version recorded (no release happened this run)."
          fi
  success:
    runs-on: ubuntu-26.04
    needs:
      - release
      - lint
      - build
      - test-extensively
    if: >-
      always() && (
        contains(join(needs.*.result, ','), 'failure')
        || !contains(join(needs.*.result, ','), 'cancelled')
      )
    steps:
      - name: Verify that there were no failures
        run: ${{ !contains(join(needs.*.result, ','), 'failure') }}
