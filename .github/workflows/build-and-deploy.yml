name: CI/CD Process
on:
  workflow_call:
    outputs:
      version:
        description: "The version semantic-release released this run, if any (empty if no release happened)."
        value: ${{ jobs.release.outputs.version }}
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: DanySK/action-checkout@0.2.31
      - name: Ensure a headless-capable Chrome is available (for :ide-web:browserE2ETest)
        run: |
          # ubuntu-24.04 GitHub-hosted runners ship Google Chrome preinstalled (see actions/runner-images);
          # jsBrowserTest's karma-chrome-launcher already relies on that with no setup step of its own. This
          # only falls back to installing it if that default ever stops holding.
          if command -v google-chrome-stable >/dev/null || command -v google-chrome >/dev/null \
              || command -v chromium-browser >/dev/null || command -v chromium >/dev/null; then
            echo "Chrome already present (default runner image)."
          else
            echo "No default Chrome found; installing google-chrome-stable."
            sudo apt-get update && sudo apt-get install -y google-chrome-stable
          fi
      - uses: DanySK/build-check-deploy-gradle-action@4.0.44
        with:
          retries-on-failure: '2'
          # Dry-deployment
          deploy-command: >-
            ./gradlew
            publishAllPublicationsToProjectLocalRepository
            zipMavenCentralPortalPublication 
            releaseMavenCentralPortalPublication
            --dry-run
          check-command: ./gradlew check --parallel --continue
          should-deploy: true
          should-run-codecov: false
          maven-central-username: ${{ secrets.MAVEN_USERNAME }}
          maven-central-password: ${{ secrets.MAVEN_PASSWORD }}
          signing-key: ${{ secrets.SIGNING_KEY }}
          signing-password: ${{ secrets.SIGNING_PASSWORD }}
      - name: Run the ide-web browser end-to-end suite
        # Deliberately its own `./gradlew` invocation, not part of `check` above: running jsBrowserTest and
        # browserE2ETest's production webpack build within the SAME Gradle build corrupts state shared between
        # the two separate webpack executions (verified locally: the production bundle silently drops code that
        # is present, and passes every time, when this runs as its own build). See ide-web/build.gradle.kts.
        run: ./gradlew :ide-web:browserE2ETest
  test-extensively:
    needs:
      - build
    # if: github.ref_name != 'master' || github.event.commits[0].author.name != 'renovate[bot]'
    uses: ./.github/workflows/test-extensively.yml
  release:
    permissions:
      contents: write
      packages: write
      id-token: write  # Required for OIDC on npmjs
    needs:
      - build
      - test-extensively
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.released-version.outputs.version }}
    steps:
      - name: Checkout
        uses: DanySK/action-checkout@0.2.31
        with:
          token: ${{ secrets.DEPLOYMENT_TOKEN || github.token }}
      - name: Install Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: package.json
      - uses: DanySK/build-check-deploy-gradle-action@4.0.44
        with:
          retries-on-failure: '1'
          build-command: ./gradlew clean
          check-command: true
          deploy-command: |
            npm install
            npx semantic-release
          enable-cache: false
          should-run-codecov: false
          should-deploy: true
          npm-token: ${{ secrets.NPM_TOKEN }}
          github-token: ${{ github.token }}
          maven-central-username: ${{ secrets.MAVEN_USERNAME }}
          maven-central-password: ${{ secrets.MAVEN_PASSWORD }}
          signing-key: ${{ secrets.SIGNING_KEY }}
          signing-password: ${{ secrets.SIGNING_PASSWORD }}
      - name: Record the released version for downstream jobs
        # semantic-release's own deploy step (above) has no output build-check-deploy-gradle-action exposes,
        # so release.config.js drops the version into a $RUNNER_TEMP file instead (see its recordVersionCmd);
        # this step is what turns that file into an actual job output (see docs.yml, which consumes it).
        id: released-version
        run: |
          if [ -f "$RUNNER_TEMP/last-release-version.txt" ]; then
            echo "version=$(cat "$RUNNER_TEMP/last-release-version.txt")" >> "$GITHUB_OUTPUT"
          else
            echo "No release version recorded (no release happened this run)."
          fi
  success:
    runs-on: ubuntu-24.04
    needs:
      - release
      - build
      - test-extensively
    if: >-
      always() && (
        contains(join(needs.*.result, ','), 'failure')
        || !contains(join(needs.*.result, ','), 'cancelled')
      )
    steps:
      - name: Verify that there were no failures
        run: ${{ !contains(join(needs.*.result, ','), 'failure') }}
